
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Kitty tặng hoa điểm 10 🌸</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg,#ffe2f0,#fff5d8,#fce0ff);
  color: #b83275;
  overflow-x: hidden;
}

.card {
  width: min(850px,100%);
  text-align: center;
  padding: 25px 15px;
  border: 3px solid white;
  border-radius: 30px;
  background: #ffffff99;
  box-shadow: 0 18px 55px #d85b9633;
}

h1 {
  color: #ec4d98;
  font-size: clamp(26px,5vw,43px);
}

.subtitle { font-size: 17px; }

.scene {
  width: min(650px,100%);
  margin: auto;
}

svg {
  width: 100%;
  height: auto;
}

.kitty {
  transform-origin: 330px 500px;
  animation: arrive 2s ease-out both,
             bob 3s 2s ease-in-out infinite;
}

.flower {
  transform-origin: 470px 250px;
  animation: present 1.5s 1.5s ease-out both;
}

.sparkle {
  animation: twinkle 1.5s infinite alternate;
}

.caption {
  font-size: 28px;
  font-weight: bold;
  color: #e83f8d;
}

button {
  margin-top: 20px;
  padding: 14px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(90deg,#ff75b4,#ed438e);
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.rain {
  position: fixed;
  top: -30px;
  pointer-events: none;
  animation: fall 4s linear forwards;
}

@keyframes arrive {
  from {
    opacity: 0;
    transform: translate(-100px,35px) scale(.7);
  }
  to {
    opacity: 1;
    transform: translate(0,0) scale(1);
  }
}

@keyframes bob {
  0%,100% { translate: 0 0; }
  50% { translate: 0 -7px; }
}

@keyframes present {
  from {
    transform: rotate(-18deg) scale(.4);
    opacity: 0;
  }
  to {
    transform: rotate(0) scale(1);
    opacity: 1;
  }
}

@keyframes twinkle {
  from { opacity: .3; }
  to { opacity: 1; }
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(500deg);
    opacity: 0;
  }
}
</style>
</head>

<p>

Chúc bạn luôn vui vẻ và tỏa sáng!
</p>

<button onclick="rainHearts()">
💖 NHẬN THÊM YÊU THƯƠNG
</button>

</main>

<script>
function rainHearts() {

  const icons = ["💗","🌸","✨","💕","⭐"];

  for (let i = 0; i < 45; i++) {

    const el = document.createElement("span");

    el.className = "rain";

    el.textContent =
      icons[Math.floor(Math.random()*icons.length)];

    el.style.left = Math.random()*100 + "vw";

    el.style.fontSize =
      (16 + Math.random()*22) + "px";

    el.style.animationDuration =
      (3 + Math.random()*3) + "s";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 6500);
  }
}
</script>

</body>
</html>
